# tmux config. Source of truth: ~/workflow-helper/ubuntu/tmux.conf
# Reload into a running server: tmux source-file ~/.tmux.conf

# --- Rendering ---------------------------------------------------------------
# 256-color terminfo inside panes; truecolor passthrough to Cursor's terminal.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g escape-time 10          # fast Esc for Claude Code without eating Alt- keys
set -g focus-events on
set -g history-limit 50000

# --- Resize ------------------------------------------------------------------
# Follow the size of the most recent active client (mirror clients of other
# sizes clip instead of shrinking everyone).
setw -g aggressive-resize on
set -g window-size latest
# After every client resize, send Ctrl+L so the pane repaints at the new
# width instead of leaving artifacts. C-l means "redraw" almost everywhere:
# Claude Code repaints its frame, readline redraws the prompt and keeps the
# typed line, vim/less refresh. Claude Code runs in the MAIN screen buffer
# (no alternate screen), so an alternate_on guard would never fire for it.
set-hook -g client-resized 'send-keys C-l'

# --- Mouse and copy ----------------------------------------------------------
set -g mouse on
set -g set-clipboard on        # OSC 52 fallback for remote / SSH attaches
setw -g mode-keys vi

# Drag-select copies to the system clipboard and KEEPS the selection visible;
# the view does not jump. Click once or press q to dismiss.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear 'wl-copy'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear 'wl-copy'

# Double-click = word, triple-click = line, straight to the clipboard.
bind -T root         DoubleClick1Pane copy-mode -M \; send -X select-word \; send -X copy-pipe-no-clear 'wl-copy'
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear 'wl-copy'
bind -T root         TripleClick1Pane copy-mode -M \; send -X select-line \; send -X copy-pipe-no-clear 'wl-copy'
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear 'wl-copy'

# Keyboard copy: y copies and keeps the selection, Enter copies and closes.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear 'wl-copy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'

# Drag ALWAYS starts a tmux selection, even if the app grabbed the mouse —
# Claude Code has no use for drags, and this is what makes select reliable.
bind -T root MouseDrag1Pane copy-mode -M

# Wheel: forward to an app that tracks the mouse; otherwise arrows for
# full-screen apps (same as Cursor's own terminal) or scrollback for a shell.
bind -T root WheelUpPane   if -F '#{mouse_any_flag}' 'send-keys -M' { if -F '#{alternate_on}' 'send-keys -N3 Up' 'copy-mode -e ; send-keys -M' }
bind -T root WheelDownPane if -F '#{mouse_any_flag}' 'send-keys -M' { if -F '#{alternate_on}' 'send-keys -N3 Down' '' }

# --- Status line -------------------------------------------------------------
set -g status-interval 5
set -g status-right "%H:%M"
