[project]
name = "cc-mirror"
version = "0.1.0"
description = "Mouse-first dashboard for all running Claude Code sessions."
readme = "spec.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
cc-mirror = "cc_mirror.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_mirror"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
